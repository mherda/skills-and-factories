# XcodeGen spec: the source of truth for the Xcode project. The .xcodeproj and
# Info.plist are generated from it (`xcodegen generate`), so edit this file, never
# them. Run xcodegen after adding, removing or renaming any file.
name: {{APP}}
options:
  deploymentTarget:
    iOS: "{{IOS_MIN}}"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Read by Info.plist (CFBundleShortVersionString / CFBundleVersion).
    # /testflight sets the build number for each upload.
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "{{TEAM_ID}}"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "{{IOS_MIN}}"
targets:
  {{APP}}:
    type: application
    platform: iOS
    sources:
      - path: {{APP}}
    scheme:
      testTargets:
        - {{APP}}Tests
    info:
      path: {{APP}}/Info.plist
      properties:
        CFBundleDisplayName: "{{DISPLAY_NAME}}"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight] # only:universal
        # Purpose strings (NSLocationWhenInUseUsageDescription, ...) go here,
        # added by the job that first needs the permission.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        # Set per target: XcodeGen's iOS default ("1,2") overrides the project level.
        TARGETED_DEVICE_FAMILY: "{{DEVICE_FAMILY}}"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  {{APP}}Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: {{APP}}Tests
    dependencies:
      - target: {{APP}}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}Tests
        TARGETED_DEVICE_FAMILY: "{{DEVICE_FAMILY}}"
